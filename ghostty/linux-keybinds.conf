# Ghostty keybinds for Linux only — loaded via `config-file = ?linux.conf`
# from ghostty/config. ghostty/install.sh links this as linux.conf on Linux;
# never on macOS.

# Toshy (toshy/install.sh) makes the Mac keyboard work as on macOS. In
# terminals it turns Cmd+C/V/T/W/N into Ghostty's Linux defaults
# (ctrl+shift+…), Cmd+D / Cmd+Shift+D into the ctrl+shift+o / ctrl+shift+e
# splits, Cmd+←/→ into Home/End, Cmd+⌫ into ^U and Option+←/→ into
# ctrl+←/→, and it leaves Ctrl as Ctrl (Ctrl+C interrupts). Toshy relies on
# Ghostty's default shortcuts, so only add bindings here for keys Ghostty
# leaves unbound; never rebind ctrl+<letter>, those belong to the shell.

# Cmd+Shift+[ / ] → previous / next tab
keybind = ctrl+shift+bracket_left=previous_tab
keybind = ctrl+shift+bracket_right=next_tab

# Cmd+1…9 → go to tab (Ghostty's own alt+1…9 defaults stay too)
keybind = ctrl+1=goto_tab:1
keybind = ctrl+2=goto_tab:2
keybind = ctrl+3=goto_tab:3
keybind = ctrl+4=goto_tab:4
keybind = ctrl+5=goto_tab:5
keybind = ctrl+6=goto_tab:6
keybind = ctrl+7=goto_tab:7
keybind = ctrl+8=goto_tab:8
keybind = ctrl+9=last_tab

# Cmd+C → Ctrl+Insert (toshy/slices/user_apps.py). Copy Ghostty's own
# selection; with none, `performable:` passes the key on so tmux can copy its
# mouse selection (tmux binds C-IC; zsh swallows it at the prompt).
keybind = performable:ctrl+insert=copy_to_clipboard
