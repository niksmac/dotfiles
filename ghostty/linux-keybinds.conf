# Ghostty keybinds for Linux only — loaded via `config-file = ?linux.conf`
# from ghostty/config. ghostty/install.sh links this as linux.conf on Linux;
# never on macOS, where these would clobber ctrl+w/q/n/c in the shell.

# Logitech Mac-layout keyboard: the key labeled "Cmd" sends ctrl on Linux,
# so alias the common shortcuts to ctrl+ as well.
# performable: ctrl+c copies only when there is a selection; otherwise it
# reaches the shell as ^C (interrupt), like Cmd+C vs Ctrl+C on macOS.
keybind = performable:ctrl+c=copy_to_clipboard:mixed
keybind = ctrl+v=paste_from_clipboard
keybind = ctrl+t=new_tab
keybind = ctrl+n=new_window
keybind = ctrl+w=close_tab
keybind = ctrl+q=quit

# Cmd(=ctrl)+arrow / backspace: start / end of line, delete line — as on macOS.
keybind = ctrl+arrow_left=text:\x01
keybind = ctrl+arrow_right=text:\x05
keybind = ctrl+backspace=text:\x15

# NB: no super+shift+left/right — GNOME binds those to move-to-workspace
# and consumes them. Ghostty's ctrl+shift+arrow_left/right defaults do tabs.

# GNOME's wm binds <Super>d to show-desktop at the compositor level, so
# super+d is swallowed before Ghostty sees it. Use ctrl+alt+d (or the
# ctrl+shift+o/e Ghostty defaults) for splits on GNOME.
keybind = ctrl+alt+d=new_split:right
keybind = ctrl+alt+shift+d=new_split:down
